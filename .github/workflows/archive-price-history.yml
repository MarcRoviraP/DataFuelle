name: Archive price_history to Storage

on:
  schedule:
    # Every Sunday at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      retention_days:
        description: 'Days to keep hot in Postgres price_history (min 7)'
        required: false
        default: '30'
      max_rows_threshold:
        description: 'Row count threshold warning/trigger'
        required: false
        default: '200000'
      dry_run:
        description: 'Run without uploading or deleting'
        required: false
        type: boolean
        default: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --no-cache-dir requests pandas pyarrow

      - name: Run price_history archive
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RETENTION_DAYS: ${{ inputs.retention_days || '30' }}
          MAX_ROWS_THRESHOLD: ${{ inputs.max_rows_threshold || '200000' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: python scripts/archive_price_history.py
